[project]
name = "gdoc"
version = "0.1.0"
description = "Pull Google Docs into high-fidelity Markdown and HTML."
license = "AGPL-3.0-or-later"
authors = [{ name = "Danny O'Brien", email = "danny@spesh.com" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "build",
    "twine",
    "coverage",
]

[project.scripts]
gdoc = "google_doc_diff.cli:cli"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "google_doc_diff"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    "B008",
]
